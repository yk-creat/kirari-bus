<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>溝22 喜楽里バスナビ</title>

  <!-- iOS PWA (ホーム画面追加時) 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="喜楽里バス">
  <meta name="theme-color" content="#12131a">

  <style>
    :root {
      --bg-color: #12131a;
      --card-bg: #1c1e29;
      --card-inner: #252837;
      --accent-color: #ff9f43;
      /* サウナ・温泉の温かみ */
      --accent-active: #ff5252;
      --text-main: #f5f6fa;
      --text-sub: #8e95a5;
      --border-color: #2e3244;
      --btn-bg: #282c3c;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 10px) 16px calc(var(--safe-bottom) + 16px);
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-color);
      letter-spacing: 0.03em;
    }

    .revision-tag {
      font-size: 0.65rem;
      background: rgba(255, 159, 67, 0.15);
      color: var(--accent-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* 行き・帰り 切り替えトグル */
    .direction-toggle {
      display: flex;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    .direction-btn {
      flex: 1;
      padding: 12px 6px;
      text-align: center;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .direction-btn.active {
      background: var(--accent-color);
      color: #12131a;
      box-shadow: 0 4px 14px rgba(255, 159, 67, 0.4);
    }

    /* 曜日切り替えバー */
    .day-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .day-btn {
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .day-btn.active {
      border-color: var(--accent-color);
      color: var(--accent-color);
      background: rgba(255, 159, 67, 0.08);
    }

    /* メインカウントダウンカード */
    .main-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
    }

    .route-info {
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .dep-time-badge {
      display: inline-block;
      font-size: 1.3rem;
      font-weight: 800;
      background: rgba(255, 159, 67, 0.15);
      color: var(--accent-color);
      padding: 4px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }

    .countdown-label {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .countdown-timer {
      font-size: 3.3rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .countdown-timer .unit {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-left: 2px;
      margin-right: 6px;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-color);
      min-height: 20px;
    }

    /* 直近の予定リスト */
    .upcoming-section {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
      flex-grow: 1;
    }

    .upcoming-header {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .upcoming-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .upcoming-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--card-inner);
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .upcoming-item.first {
      border-left: 3px solid var(--accent-color);
    }

    .upcoming-item .time {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .upcoming-item .diff {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* 公式直リンクボタングループ */
    .link-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    .official-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1e3799;
      color: #ffffff;
      text-decoration: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(30, 55, 153, 0.35);
      transition: opacity 0.2s;
    }

    .official-link-btn:active {
      opacity: 0.8;
    }

    .official-sublink-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--btn-bg);
      color: #82ccdd;
      text-decoration: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
    }

    .now-indicator {
      font-size: 0.72rem;
      color: var(--text-sub);
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>

      <span class="app-title">♨️ 溝22 喜楽里バスナビ</span>

    </div>
  </header>

  <div class="direction-toggle">
    <div class="direction-btn active" id="btn-outbound" onclick="setDirection('outbound')">
      行き：駅 ➔ 喜楽里
    </div>
    <div class="direction-btn" id="btn-inbound" onclick="setDirection('inbound')">

  </div>

    <button class="day-btn" id="day-saturday" onclick="setDayType('saturday')">土曜</button>
    <button class="day-btn" id="day-holiday" onclick="setDayType('holiday')">休日</button>

  <!-- メインカウントダウン -->

      --<span class="unit">分</span>--<span class="unit">秒</span>
    </div>
    <div class="status-msg" id="status-msg"></div>
  </div>

  <!-- 直近数本 -->
  <div class="upcoming-section">
    <div class="upcoming-header">

    <div class="upcoming-list" id="upcoming-list">

    <a id="official-link" href="https://tokyu.bus-location.jp/" target="_blank" rel="noopener"
      class="official-link-btn">
      <span>📡 東急バスナビ（公式・接近情報）を開く</span>
    </a>

    // 状態管理
    let currentDirection = 'outbound';

    // 曜日の自動判定
    function detectDayType() {
      const now = new Date();
      const day = now.getDay(); // 0: 日曜, 6: 土曜
      if (day === 0) return 'holiday';
      if (day === 6) return 'saturday';
      return 'weekday';
    }

    // 方向切り替え
    function setDirection(dir) {
      currentDirection = dir;
      document.getElementById('btn-outbound').classList.toggle('active', dir === 'outbound');
      document.getElementById('btn-inbound').classList.toggle('active', dir === 'inbound');
      updateUI();
    }

    // 曜日切り替え
    function setDayType(type) {
      currentDayType = type;
      ['weekday', 'saturday', 'holiday'].forEach(t => {
        document.getElementById(`day-${t}`).classList.toggle('active', t === type);
      });
      updateUI();
    }

    // メイン更新処理
    function updateUI() {
      const now = new Date();

      // 時計表示
      const timeStr = now.toTimeString().split(' ')[0];
      document.getElementById('current-clock').textContent = `現在時刻 ${timeStr}`;

      const dirData = timetableData[currentDirection];
      document.getElementById('route-desc').textContent = dirData.title;

      const dayLabels = { weekday: '平日ダイヤ', saturday: '土曜ダイヤ', holiday: '休日ダイヤ' };
      document.getElementById('day-label').textContent = dayLabels[currentDayType];

      const times = dirData[currentDayType];
      const nowSeconds = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();

      // 直近の便を探す
      const upcoming = [];
      for (const t of times) {
        const [h, m] = t.split(':').map(Number);
        const busSeconds = (h * 3600) + (m * 60);
        if (busSeconds >= nowSeconds) {
          upcoming.push({ timeStr: t, diffSec: busSeconds - nowSeconds });
        }
      }

      const timerDisplay = document.getElementById('timer-display');
      const depBadge = document.getElementById('dep-time');
      const statusMsg = document.getElementById('status-msg');
      const listContainer = document.getElementById('upcoming-list');

      if (upcoming.length === 0) {
        depBadge.textContent = "本日の運行終了";
        timerDisplay.innerHTML = `--<span class="unit">分</span>--<span class="unit">秒</span>`;
        statusMsg.textContent = "本日の便はすべて終了しました";
        statusMsg.style.color = "var(--text-sub)";
        listContainer.innerHTML = `<div style="text-align:center; color:var(--text-sub); padding:12px; font-size:0.85rem;">本日の出発予定はありません</div>`;
        return;
      }

      // 次のバス
      const nextBus = upcoming[0];
      depBadge.textContent = `${nextBus.timeStr} 発`;

      const diffMin = Math.floor(nextBus.diffSec / 60);
      const diffSec = nextBus.diffSec % 60;

      const minStr = String(diffMin).padStart(2, '0');
      const secStr = String(diffSec).padStart(2, '0');

      timerDisplay.innerHTML = `${minStr}<span class="unit">分</span>${secStr}<span class="unit">秒</span>`;

      if (diffMin <= 2) {
        statusMsg.textContent = "まもなくバスが発車します！";
        statusMsg.style.color = "var(--accent-active)";
        timerDisplay.style.color = "var(--accent-active)";
      } else if (diffMin <= 5) {
        statusMsg.textContent = "のりばへ向かいましょう";
        statusMsg.style.color = "var(--accent-color)";
        timerDisplay.style.color = "var(--accent-color)";
      } else {
        statusMsg.textContent = "";
        timerDisplay.style.color = "var(--text-main)";
      }

      // 直近数本（最大5本）
      listContainer.innerHTML = '';
      const showCount = Math.min(upcoming.length, 5);
      for (let i = 0; i < showCount; i++) {
        const item = upcoming[i];
        const m = Math.floor(item.diffSec / 60);
        const div = document.createElement('div');
        div.className = `upcoming-item ${i === 0 ? 'first' : ''}`;
        div.innerHTML = `
          <span class="time">${i === 0 ? '▶ ' : ''}${item.timeStr} 発</span>
          <span class="diff">あと ${m}分後</span>
        `;
        listContainer.appendChild(div);
      }
    }

    // 初期化
    setDayType(currentDayType);
    updateUI();

    // 毎秒更新
    setInterval(updateUI, 1000);
  </script>
</body>

</html>
